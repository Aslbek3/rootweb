<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<!-- Mavzuni sahifa chizilishidan OLDIN qo'yadi (FOUC bo'lmasligi uchun).
     Inline emas, alohida fayl — shunda CSP `script-src 'self'` qat'iy
     bo'la oladi va 'unsafe-inline' kerak bo'lmaydi. -->
<script src="/theme-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Code Web</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#262624">
<link rel="apple-touch-icon" href="/icon.svg">
<!-- Fayl ko'ruvchidagi syntax highlighting (faqat READ rejimida, muharrir
     hali oddiy textarea).
     ⚠️ Avval bu cdnjs'dan, `integrity` (SRI) sarlavhasisiz yuklanardi. Bu
     ilova root shell beradi, ya'ni CDN buzilsa yoki ushlab qolinsa —
     autentifikatsiyalangan origin ichida ixtiyoriy JS ishga tushib, butun
     VPS qo'ldan ketardi. Sintaksis bo'yash kabi kosmetik funksiya uchun bu
     juda qimmat narx edi, shuning uchun fayl `public/vendor/` ga
     ko'chirildi — tashqi bog'liqlik butunlay yo'q. -->
<link rel="stylesheet" href="/vendor/highlight-github-dark.min.css">
<script src="/vendor/highlight.min.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="tl-title">
        <span class="status-dot" id="statusDot"></span>
        <span class="tl-name">Claude Code</span>
        <span class="cwd" id="cwdLabel">—</span>
        <span class="pm2-badge hidden" id="pm2StatusBadge"></span>
      </div>
      <div class="tl-actions">
        <button class="icon-btn" id="clearChatBtn" title="Chatni tozalash" aria-label="Chatni tozalash">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 5v6h-6"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="Mavzu (bosib almashtiring)" aria-label="Mavzu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18V3z" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn" id="notifyBtn" title="Bildirishnomalar" aria-label="Bildirishnomalar">
          <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 1 1 12 0c0 3.2 1 5 2 6H4c1-1 2-2.8 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
          <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 1 1 12 0c0 3.2 1 5 2 6H4c1-1 2-2.8 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/><path d="M3 3l18 18"/></svg>
        </button>
        <button class="icon-btn" id="filesBtn" title="Fayllar va loyihalar" aria-label="Fayllar va loyihalar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6z"/></svg>
          <span class="badge-dot hidden" id="filesBadge"></span>
        </button>
        <a class="icon-btn" href="/auth.html" title="Claude hisobini ulash" aria-label="Claude hisobini ulash">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9"/><path d="M16 7l3 3"/><path d="M13 10l2.5 2.5"/></svg>
        </a>
        <button class="icon-btn" id="logoutBtn" title="Chiqish" aria-label="Chiqish">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9"/></svg>
        </button>
      </div>
    </header>

    <div id="messages"></div>

    <div class="composer-wrap">
      <form id="composer">
        <div id="attachmentRow" class="attachment-row hidden"></div>
        <textarea id="input" rows="1" placeholder="Xabar yozing..."></textarea>
        <div class="composer-toolbar">
          <div class="composer-toolbar-left">
            <button type="button" id="attachBtn" class="icon-btn-sm" title="Rasm yoki fayl biriktirish" aria-label="Rasm yoki fayl biriktirish">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <input type="file" id="composerFileInput" class="hidden" multiple>
            <button type="button" id="modeBtn" class="mode-pill" data-mode="default" title="Ruxsat rejimi (bosib almashtiring)">Manual</button>
          </div>
          <div class="composer-toolbar-right">
            <button type="button" id="stopBtn" title="To'xtatish" aria-label="To'xtatish">
              <svg viewBox="0 0 24 24" aria-hidden="true" width="12" height="12"><rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor" stroke="none"/></svg>
            </button>
            <button type="submit" id="sendBtn" title="Yuborish" aria-label="Yuborish">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="drawerOverlay" class="overlay hidden"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-header">
      <div class="drawer-tabs">
        <button type="button" class="drawer-tab active" data-tab="projects">loyihalar</button>
        <button type="button" class="drawer-tab" data-tab="files">fayllar</button>
        <button type="button" class="drawer-tab" data-tab="bots">botlar</button>
        <button type="button" class="drawer-tab" data-tab="limit">limit</button>
      </div>
      <button class="icon-btn" id="drawerCloseBtn" title="Yopish" aria-label="Yopish">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="drawer-panel" id="panelProjects">
      <form id="addProjectForm" class="add-project-form">
        <input type="text" id="newProjectPath" placeholder="mavjud papka yo'li" required>
        <button type="submit" title="Qo'shish">+</button>
      </form>
      <button type="button" id="newProjectMetaToggle" class="new-project-toggle">+ kontekst / PM2 nomi (ixtiyoriy)</button>
      <div id="newProjectMetaFields" class="create-project-form hidden">
        <textarea id="newProjectDescription" placeholder="Loyiha haqida qisqa kontekst — Claude har safar suhbat boshlanganda avtomatik biladi (masalan: poster-02, @avtopost3_bot, sodda versiya)" rows="2"></textarea>
        <input type="text" id="newProjectPm2Name" placeholder="PM2 process nomi (masalan poster-02), botlar panelida bog'lash uchun">
      </div>

      <button type="button" id="newProjectToggle" class="new-project-toggle">+ yangi loyiha papkasi yaratish</button>
      <form id="createProjectForm" class="create-project-form hidden">
        <input type="text" id="newProjectParent" placeholder="ota papka, masalan D:\Loyihalar" required>
        <input type="text" id="newProjectName" placeholder="yangi papka nomi" required>
        <button type="submit">yarat va och</button>
      </form>

      <div id="projectList" class="project-list"></div>
    </div>

    <div class="drawer-panel hidden" id="panelFiles">
      <div class="file-breadcrumb-row">
        <div id="fileBreadcrumb" class="file-breadcrumb"></div>
        <button type="button" id="gotoRootBtn" class="icon-btn" title="/root'ga o'tish" aria-label="/root'ga o'tish">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        </button>
        <button type="button" id="uploadFileBtn" class="icon-btn" title="Fayl yuklash" aria-label="Fayl yuklash">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        </button>
        <button type="button" id="newFolderToggle" class="icon-btn" title="Yangi papka" aria-label="Yangi papka">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
        </button>
      </div>
      <input type="file" id="uploadFileInput" class="hidden">
      <div id="uploadStatus" class="empty-hint hidden"></div>
      <form id="createFolderForm" class="create-project-form hidden">
        <input type="text" id="newFolderName" placeholder="papka nomi" required>
        <button type="submit">yarat</button>
      </form>
      <div id="fileTree" class="file-tree"></div>
    </div>

    <div class="drawer-panel hidden" id="panelBots">
      <div class="empty-hint">PM2'dagi jarayonlar — holat, CPU/RAM, qayta ishga tushirish soni. Har 12 soniyada avtomatik yangilanadi.</div>
      <div id="botList" class="bot-list"></div>
    </div>

    <div class="drawer-panel hidden" id="panelLimit">
      <div id="rateLimitStats" class="rate-limit-stats"></div>
      <div id="usageStats" class="usage-stats"></div>
      <div class="empty-hint">"Joriy sessiya" faqat server ishga tushirilgandan beri hisoblanadi (server qayta ishga tushirilsa nolga qaytadi). 5-soatlik/haftalik limit — Claude hisobingizning haqiqiy holati.</div>
    </div>
  </aside>

  <div id="fileViewerOverlay" class="overlay hidden"></div>
  <div id="fileViewer" class="file-viewer">
    <div class="file-viewer-header">
      <span id="fileViewerName"></span>
      <a class="icon-btn" id="fileDownloadBtn" title="Yuklab olish" aria-label="Yuklab olish" download>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      </a>
      <button class="icon-btn" id="fileEditBtn" title="Tahrirlash" aria-label="Tahrirlash">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L15.5 5.5a1.5 1.5 0 0 1 2 2L7 18l-4 1"/><path d="M13.5 7.5l2 2"/></svg>
      </button>
      <button class="icon-btn hidden" id="fileSaveBtn" title="Saqlash" aria-label="Saqlash">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
      <button class="icon-btn" id="fileViewerCloseBtn" title="Yopish" aria-label="Yopish">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <pre id="fileViewerContent" class="file-viewer-content"></pre>
    <textarea id="fileViewerEditor" class="file-viewer-editor hidden" spellcheck="false"></textarea>
  </div>

  <script src="/app.js"></script>
</body>
</html>
