<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude hisobini ulash · Claude Code Web</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#262624">
<style>
  .auth-wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px calc(24px + var(--safe-bottom)); overflow-y: auto; height: 100%; }
  .auth-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .auth-card h2 { margin: 0 0 8px; font-size: 15px; color: var(--text); }
  .auth-card p { margin: 4px 0; font-size: 13px; }
  .auth-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 10px 16px; font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; transition: background-color .12s ease; }
  .auth-btn:disabled { opacity: 0.5; cursor: default; }
  .auth-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-glow); }
  @media (hover: hover) and (pointer: fine) {
    .auth-btn:hover:not(:disabled) { background: var(--accent-bright); }
  }
  .auth-link-box { word-break: break-all; background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; margin: 10px 0; font-size: 12px; }
  .auth-link-box a { color: var(--accent-bright); }
  .auth-input-row { display: flex; gap: 8px; margin-top: 10px; }
  .auth-input-row input { flex: 1; background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; color: var(--text); font-family: var(--sans); font-size: 14px; }
  .auth-output { white-space: pre-wrap; word-break: break-all; font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; max-height: 240px; overflow-y: auto; font-family: var(--mono); }
  .auth-status { font-size: 12px; margin-top: 8px; }
  .auth-status.ok { color: var(--ok); }
  .auth-status.err { color: var(--danger); }
  .back-link { display: inline-block; margin-bottom: 16px; color: var(--text-dim); text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
  <div class="auth-wrap">
    <a class="back-link" href="/">&larr; orqaga</a>
    <div class="auth-card">
      <h2>Claude hisobini ulash</h2>
      <p class="dim">Bu ilova ishlatadigan Claude hisobini shu yerdan ulaysiz — SSH/terminal shart emas.</p>
      <button class="auth-btn" id="startBtn" type="button">Boshlash</button>
      <div id="linkArea"></div>
    </div>

    <div class="auth-card" id="codeCard" style="display:none">
      <h2>Kodni kiriting</h2>
      <p class="dim">Havolani ochib, kerakli Claude hisobingiz bilan tasdiqlagach chiqqan kodni shu yerga joylashtiring.</p>
      <div class="auth-input-row">
        <input type="text" id="codeInput" placeholder="kod (masalan: XXXX#YYYY)" autocomplete="off">
        <button class="auth-btn" id="submitBtn" type="button">Yuborish</button>
      </div>
    </div>

    <div class="auth-card">
      <h2>Holat</h2>
      <div id="statusMsg" class="auth-status dim">hali boshlanmagan</div>
      <div class="auth-output" id="output"></div>
    </div>
  </div>

  <script src="/auth.js"></script>

</body>
</html>
