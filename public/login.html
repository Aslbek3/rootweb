<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kirish · Claude Code Web</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#262624">
</head>
<body class="login-body">
  <div class="login-wrap">
    <form class="login-card" id="loginForm" autocomplete="off">
      <div class="login-mark" aria-hidden="true">C</div>
      <div class="login-boot">
        <p>Claude Code Web</p>
        <p class="dim">Davom etish uchun parolni kiriting</p>
      </div>
      <label class="login-label" for="password">Parol</label>
      <input type="password" id="password" autocomplete="current-password" autofocus required>
      <button type="submit">Kirish</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json().catch(() => ({}));
          errorMsg.textContent = data.error || 'Parol noto\'g\'ri';
        }
      } catch (err) {
        errorMsg.textContent = 'Serverga ulanib bo\'lmadi';
      }
    });
  </script>
</body>
</html>
