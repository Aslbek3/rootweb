# Resurs cheklovi — root PM2 daraxti (rootweb + 26 ta bot)
# ============================================================
# VPS: 12 GB RAM, 6 vCPU, 200 GB SSD (Contabo Cloud VPS 6)
#
# ⚠️ MUHIM FARQ: rootweb root'ning UMUMIY PM2 daemonida ishlaydi
# (`pm2-root.service`), ya'ni bu cheklov 26 ta botga ham tegadi —
# ular bitta cgroup'da.
#
# Bu VPS uchun himoya: xotira tugaganda OOM killer butun tizim bo'ylab
# emas, shu cgroup ichida ishlaydi — PostgreSQL va claudeuz tegilmaydi.
#
# Kamchiligi: rootweb'ning Claude sessiyasi ko'p xotira olsa, o'sha
# cgroup ichidagi BOT o'ldirilishi mumkin. Buni butunlay yo'q qilish
# uchun pastdagi "B variant"ga qarang.
#
# O'rnatish (A variant — oddiy, tavsiya etiladi birinchi qadam sifatida):
#   sudo mkdir -p /etc/systemd/system/pm2-root.service.d
#   sudo cp deploy/systemd-limits-root.conf \
#           /etc/systemd/system/pm2-root.service.d/limits.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart pm2-root
#   systemctl show pm2-root -p MemoryMax -p CPUQuota -p TasksMax
#
# ============================================================
# NEGA SHU QIYMATLAR
# ============================================================
# O'lchangan (2026-09-13):
#   26 ta bot                    ~3.3 GB
#   + rootweb veb-server         ~0.1 GB
#   + 3 ta Claude sessiyasi      ~1.2 GB
#   + zaxira (build, o'sish)     ~1.4 GB
#   ------------------------------------------
#   jami                         ~6.0 GB
#
# Taqsimot: 12 GB = 6 GB (root) + 3 GB (claudeuz) + 3 GB (tizim,
# PostgreSQL, nginx, sahifa keshi).

[Service]

# --- Xotira: 12 GB dan 6 GB ---
MemoryHigh=5G
MemoryMax=6G
MemorySwapMax=1G

# --- Protsessor: 6 yadrodan 4 tasi ---
# Bitta yadro har doim tizimga (PostgreSQL, nginx, SSH) qoladi —
# VPS band bo'lganda ham kirish imkoni saqlanadi.
CPUQuota=400%
CPUWeight=100

# --- Disk kirish-chiqish ---
IOWeight=100

# --- Jarayonlar soni ---
# 26 bot + pm2 + claude subprocesslar odatda ~250 task.
TasksMax=800

# --- Qayta ishga tushirish ---
Restart=always
RestartSec=10
StartLimitIntervalSec=300
StartLimitBurst=5

# ============================================================
# B VARIANT — rootweb'ni alohida xizmatga chiqarish (keyinroq)
# ============================================================
# Yuqoridagi kamchilikni (rootweb spike'i botni o'ldirishi) butunlay
# yo'q qiladi: rootweb o'z cgroup'ida, o'z chegarasi bilan ishlaydi.
#
#   1) rootweb'ni root PM2'dan chiqarish:
#        pm2 delete rootweb && pm2 save
#
#   2) /etc/systemd/system/rootweb.service:
#        [Unit]
#        Description=rootweb (Claude Code Web, root)
#        After=network.target
#
#        [Service]
#        Type=simple
#        WorkingDirectory=/root/vps/rootweb
#        EnvironmentFile=/root/vps/rootweb/.env
#        ExecStart=/root/.nvm/versions/node/v22.23.1/bin/node server/index.js
#        Restart=always
#        RestartSec=5
#        MemoryHigh=1500M
#        MemoryMax=2G
#        CPUQuota=200%
#        TasksMax=300
#        Nice=5
#
#        [Install]
#        WantedBy=multi-user.target
#
#   3) systemctl daemon-reload && systemctl enable --now rootweb
#
#   Shunda pm2-root cheklovini faqat botlarga moslash mumkin
#   (MemoryMax=4G yetadi).
