# /etc/nginx/sites-available/claude-code-web
# Faollashtirish: sudo ln -s /etc/nginx/sites-available/claude-code-web /etc/nginx/sites-enabled/
#
# DOMAIN o'rniga o'z domeningizni yozing (masalan: claude.mendomain.uz).
# Domeningiz yo'q bo'lsa, DOMAIN o'rniga VPS'ning IP manzilini yozing —
# lekin bu holda certbot HTTPS bera olmaydi (Let's Encrypt domen talab qiladi).

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (chat) ulanishi uchun Upgrade sarlavhalari shart
    location /ws {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

# HTTPS o'rnatgandan keyin (certbot --nginx -d DOMAIN buyrug'i) bu faylga
# avtomatik ravishda "listen 443 ssl;" va sertifikat yo'llari qo'shiladi.
