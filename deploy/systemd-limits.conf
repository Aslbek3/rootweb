# Resurs cheklovi — systemd drop-in
# ============================================================
#
# MUAMMO: VPS'da o'lchangan holat (2026-09-13):
#   26 ta root PM2 boti        ~3.3 GB
#   8 ta sandbox boti          ~1.2 GB
#   PostgreSQL, nginx, tizim   ~0.5 GB
#   ------------------------------------
#   Claude ishlamaganda band   ~5.0 GB
#
# Har bir ochiq Claude sessiyasi ustiga ~300-400 MB qo'shadi (alohida
# `claude` subprocess). Hech qanday cheklov YO'Q edi — ya'ni bir nechta
# loyiha ochilganda yoki `npm install` / build ishga tushganda xotira
# tugab, OOM killer QURBONNI O'ZI TANLAYDI. U PostgreSQL'ni yoki to'lov
# botini olishi mumkin.
#
# Bu fayl shuni hal qiladi: chegaraga urilganda faqat SHU xizmat
# (veb + uning botlari + claude subprocesslari) ta'sirlanadi, qolgan
# VPS tegilmaydi.
#
# ============================================================
# O'RNATISH
# ============================================================
#
# ⚠️ AVVAL VPS'ning haqiqiy resursini tekshiring:
#     free -h        # umumiy RAM
#     nproc          # yadrolar soni
#
# Quyidagi qiymatlar 8 GB / 4 yadroli VPS uchun mo'ljallangan.
# Boshqacha bo'lsa, pastdagi jadvalga qarab moslang.
#
#   rootweb uchun:
#     sudo mkdir -p /etc/systemd/system/pm2-root.service.d
#     sudo cp systemd-limits.conf /etc/systemd/system/pm2-root.service.d/limits.conf
#     # (rootweb root'ning umumiy PM2'sida ishlaydi — cheklov BARCHA root
#     #  botlariga tegadi. Faqat rootweb'ni cheklash uchun uni alohida
#     #  systemd xizmatiga chiqarish kerak, pastdagi izohga qarang.)
#
#   claudeuz uchun (tavsiya etiladi — u allaqachon alohida xizmat):
#     sudo mkdir -p /etc/systemd/system/pm2-claudeweb.service.d
#     sudo cp systemd-limits.conf /etc/systemd/system/pm2-claudeweb.service.d/limits.conf
#
#   Keyin:
#     sudo systemctl daemon-reload
#     sudo systemctl restart pm2-claudeweb
#     systemctl show pm2-claudeweb -p MemoryMax -p CPUQuota -p TasksMax
#
# Tekshirish (haqiqiy iste'mol):
#     systemctl status pm2-claudeweb        # "Memory: X (max: Y)" qatori
#     systemd-cgtop -1                       # jonli
#
# ============================================================
# QIYMATLARNI MOSLASH
# ============================================================
#
#   VPS RAM   | claudeuz MemoryMax | rootweb MemoryMax
#   ----------|--------------------|-------------------
#   4 GB      | 1G                 | 1G
#   8 GB      | 2G                 | 2G      <- quyidagi standart
#   16 GB     | 4G                 | 4G
#
#   CPUQuota: 100% = bitta yadro. 4 yadroli VPS'da 100% qo'yilsa,
#   claudeuz eng ko'pi bilan yadrolarning 1/4 ini oladi.
#
# ============================================================

[Service]

# --- Xotira ---
# MemoryMax — qat'iy chegara. Oshsa shu cgroup ichidagi jarayon o'ldiriladi
# (VPS'ning qolgani emas). MemoryHigh undan past: unga yetganda tizim
# jarayonni sekinlashtiradi va xotirani bo'shatishga urinadi — ya'ni
# ko'pincha o'ldirishgacha bormaydi.
MemoryHigh=1600M
MemoryMax=2G
MemorySwapMax=512M

# --- Protsessor ---
# 100% = bitta to'liq yadro. Build/test butun VPS'ni band qilmasligi uchun.
CPUQuota=100%
# Boshqa xizmatlar bilan raqobatda pastroq ustuvorlik (0-99, kattasi = kamroq).
CPUWeight=50
Nice=10

# --- Disk kirish-chiqish ---
# `npm install` yoki katta log yozish diskni band qilib, botlarni
# sekinlashtirmasligi uchun.
IOWeight=50

# --- Jarayonlar soni ---
# Tasodifiy fork-bomb yoki nazoratsiz spawn butun VPS'ni olmasin.
TasksMax=300

# --- Qayta ishga tushirish ---
# Chegaraga urilib o'lsa, cheksiz halqaga tushmasdan qayta ko'tarilsin.
Restart=always
RestartSec=10
StartLimitIntervalSec=300
StartLimitBurst=5
