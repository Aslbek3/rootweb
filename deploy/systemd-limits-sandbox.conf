# Resurs cheklovi — claudeuz (INSTANCE_MODE=sandbox)
# ============================================================
# VPS: 12 GB RAM, 6 vCPU, 200 GB SSD (Contabo Cloud VPS 6)
#
# O'rnatish:
#   sudo mkdir -p /etc/systemd/system/pm2-claudeweb.service.d
#   sudo cp deploy/systemd-limits-sandbox.conf \
#           /etc/systemd/system/pm2-claudeweb.service.d/limits.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart pm2-claudeweb
#
# Tekshirish:
#   systemctl show pm2-claudeweb -p MemoryMax -p CPUQuota -p TasksMax
#   systemctl status pm2-claudeweb | grep Memory
#   systemd-cgtop -1
#
# ============================================================
# NEGA SHU QIYMATLAR
# ============================================================
# O'lchangan (2026-09-13):
#   claudeuz'ning 8 ta boti      ~1.2 GB
#   + 2 ta Claude sessiyasi      ~0.8 GB   (har biri 300-400 MB)
#   + build/npm install zaxirasi ~1.0 GB
#   ------------------------------------------
#   jami kerak                   ~3.0 GB
#
# Bu — foydalanuvchi qo'ygan shartning bajarilishi: "VPS boshqa
# loyihalarga ta'sir qilmasin, hamma resursni o'zi sarflamasin".
# ACL izolyatsiyasi *nimaga kirishni* cheklaydi, *qancha yeyishni* emas —
# bu fayl aynan ikkinchisini qiladi.
#
# Chegaraga urilganda faqat SHU cgroup ichidagi jarayon o'ldiriladi.
# 26 ta root bot va PostgreSQL tegilmaydi.

[Service]

# --- Xotira: 12 GB dan 3 GB ---
# MemoryHigh — yumshoq chegara: unga yetganda tizim jarayonni
# sekinlashtiradi va xotirani bo'shatishga urinadi, ya'ni ko'pincha
# o'ldirishgacha bormaydi.
# MemoryMax — qat'iy chegara.
MemoryHigh=2500M
MemoryMax=3G
MemorySwapMax=512M

# --- Protsessor: 6 yadrodan 2 tasi ---
# 200% = ikkita to'liq yadro. `npm install` yoki build butun VPS'ni
# band qilib, botlarni sekinlashtirmasligi uchun.
CPUQuota=200%
# Raqobatda pastroq ustuvorlik (standart 100; kichikroq = kamroq ulush).
CPUWeight=50
Nice=10

# --- Disk kirish-chiqish ---
IOWeight=50

# --- Jarayonlar soni ---
# 8 bot + pm2 + node + claude subprocesslar odatda ~100 task.
# Zaxira bilan 400 — tasodifiy fork-bomb VPS'ni olmasin.
TasksMax=400

# --- Qayta ishga tushirish ---
# Chegaraga urilib o'lsa cheksiz halqaga tushmasin.
Restart=always
RestartSec=10
StartLimitIntervalSec=300
StartLimitBurst=5
